server:
  port: 8082

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/community_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
  # Spring MVC路径匹配策略（Knife4j需要ant_path_matcher）
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # Redis配置
  redis:
    host: localhost
    port: 6379
    password:
    database: 0

mybatis-plus:
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键策略：自增
      id-type: auto
  mapper:
    # mapper.xml文件位置
    mapper-locations: classpath*:mapper/**/*.xml

# Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# 微信小程序配置
wx:
  mini:
    appid: wx8a1be47ba4c029ff
    secret: 9b1a5be61d0d07afda055aab1a228b8a
    # Mock开关：true=不请求微信服务器，使用固定openid（开发调试用）
    mock-enabled: false
