server:
  port: 8081

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/community_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
  # Spring MVC路径匹配策略（Knife4j需要ant_path_matcher）
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # Redis配置
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键策略：自增
      id-type: auto
  mapper:
    # mapper.xml文件位置（classpath* 会同时扫描公共模块与后台模块）
    mapper-locations: classpath*:mapper/**/*.xml

# Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# 文件上传配置
file:
  upload-path: ./uploads
